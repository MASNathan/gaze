name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: '1'
  GOFLAGS: -mod=mod

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go test ./...
